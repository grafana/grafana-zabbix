apiVersion: 1

# Data sources for testing the APM logs Direct DB Connection path. The ClickHouse
# data source plugin is installed via GF_INSTALL_PLUGINS in docker-compose.yml.
datasources:
  # The Zabbix ClickHouse telemetry storage (otel_logs and friends)
  - name: clickhouse-apm
    type: grafana-clickhouse-datasource
    uid: clickhouse-apm
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      defaultDatabase: zabbix
      username: zabbix
    secureJsonData:
      password: zabbix

  # Zabbix data source with Direct DB Connection to ClickHouse: APM logs queries
  # read otel_logs directly instead of going through apmlog.get
  - name: zabbix-apm-directdb
    type: alexanderzobnin-zabbix-datasource
    uid: zabbix-apm-directdb
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      dbConnectionEnable: true
      dbConnectionDatasourceUID: clickhouse-apm
    secureJsonData:
      password: zabbix
