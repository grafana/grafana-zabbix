apiVersion: 1

# Provisioned data sources for end-to-end tests. Stable UIDs so tests can
# navigate to them / provisioned dashboards directly.
datasources:
  - name: Zabbix E2E
    type: alexanderzobnin-zabbix-datasource
    uid: zabbix-e2e
    url: http://zabbix-web:8080/api_jsonrpc.php
    isDefault: true
    jsonData:
      username: Admin
      trends: true
      trendsFrom: '7d'
      trendsRange: '4d'
    secureJsonData:
      password: zabbix

  # The names below must not contain "Zabbix E2E": the data source picker matches
  # by substring, and tests select the data source above by that name.

  # The Zabbix database, as the target of the direct DB connection tests.
  - name: E2E Zabbix DB
    type: grafana-postgresql-datasource
    uid: e2e-zabbix-db
    url: database:5432
    user: zabbix
    jsonData:
      database: zabbix
      sslmode: disable
    secureJsonData:
      password: zabbix

  # Zabbix data source with a global severity override, for the Problems panel tests.
  - name: E2E Zabbix severity overrides
    type: alexanderzobnin-zabbix-datasource
    uid: e2e-zabbix-severity-overrides
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      username: Admin
      severityOverrides:
        - priority: 4
          name: E2E Critical
    secureJsonData:
      password: zabbix

  # ClickHouse data source for the Direct DB Connection config editor e2e test.
  # No live ClickHouse server is running in the e2e stack: the test only
  # verifies the config editor lists it in the Direct DB Connection picker and
  # renders the ClickHouse-specific UI. Requires the grafana-clickhouse-datasource
  # plugin, installed via GF_INSTALL_PLUGINS in docker-compose.yml.
  - name: ClickHouse E2E
    type: grafana-clickhouse-datasource
    uid: clickhouse-e2e
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: zabbix
      username: default
